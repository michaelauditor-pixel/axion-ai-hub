name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Generate security audit report
        run: npm audit --json > npm-audit.json || true

      - name: Upload dependency remediation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation
          path: |
            package-lock.json
            npm-audit.json
          retention-days: 7

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
