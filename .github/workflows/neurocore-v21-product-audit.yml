name: NeuroCore V2.1 Product Audit

on:
  push:
    branches: [neurocore-v2-1-product-audit]
    paths:
      - 'neurocore/**'
      - '.github/workflows/neurocore-v21-product-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'
  SOURCE_SHA256: '0aa63928c44bbacc142db6449abb51abfb91de3bb00d92e07211a465ea39aaf2'
  V21_PATCH_SHA256: '7d388f812997d43a09f2b9e92f2d0466b68b3738317c76baaf4fd7cba58ab406'

jobs:
  audit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct validated baseline
        shell: bash
        run: |
          set -euo pipefail
          cat neurocore/ci/source_chunks/chunk_00.b64 neurocore/ci/source_chunks/chunk_01.b64 neurocore/ci/source_chunks/chunk_02.b64 neurocore/ci/source_chunks/chunk_03.b64 neurocore/ci/source_chunks/chunk_04.b64 neurocore/ci/source_chunks/chunk_05_00.b64 neurocore/ci/source_chunks/chunk_05_01.b64 neurocore/ci/source_chunks/chunk_05_02.b64 neurocore/ci/source_chunks/chunk_05_03.b64 neurocore/ci/source_chunks/chunk_06_00.b64 neurocore/ci/source_chunks/chunk_06_01.b64 neurocore/ci/source_chunks/chunk_06_02.b64 neurocore/ci/source_chunks/chunk_06_03.b64 neurocore/ci/source_chunks/chunk_07.b64 > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.tar.gz
          echo "${SOURCE_SHA256}  /tmp/source.tar.gz" | sha256sum --check --strict
          rm -rf neurocore/ci/app
          mkdir -p neurocore/ci/app
          tar -xzf /tmp/source.tar.gz -C neurocore/ci/app
          python3 - <<'PY'
          from pathlib import Path
          root=Path('neurocore/ci/app')
          p=root/'pubspec.yaml'
          s=p.read_text().replace('flutter_secure_storage: ^11.0.0','flutter_secure_storage: 10.3.1')
          p.write_text('\n'.join(x for x in s.splitlines() if not x.strip().startswith('cryptography_flutter:'))+'\n')
          m=root/'lib/main.dart'
          s=m.read_text().replace("import 'package:cryptography_flutter/cryptography_flutter.dart';\n",'').replace('  FlutterCryptography.enable();\n','').replace('FlutterCryptography.enable();\n','')
          m.write_text(s)
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Generate hardened Android wrapper and normalize baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nc
          flutter create --org br.com.neurocore --project-name neurocore_app --platforms=android /tmp/nc
          rm -rf neurocore/ci/app/android
          cp -a /tmp/nc/android neurocore/ci/app/android
          python3 - <<'PY'
          from pathlib import Path
          root=Path('neurocore/ci/app')
          k=root/'android/app/build.gradle.kts'
          k.write_text(k.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 24').replace('minSdk = 23','minSdk = 24'))
          m=root/'android/app/src/main/AndroidManifest.xml'
          m.write_text(m.read_text().replace('<application','<application android:allowBackup="false" android:usesCleartextTraffic="false"',1))
          PY
          cd neurocore/ci/app
          flutter pub get
          dart fix --apply
          python3 - <<'PY'
          from pathlib import Path
          c=Path('lib/core/security/crypto_box.dart')
          s=c.read_text().replace('const FlutterSecureStorage _secureStorage = FlutterSecureStorage();','final FlutterSecureStorage _secureStorage = const FlutterSecureStorage();').replace('const FlutterSecureStorage _secureStorage = const FlutterSecureStorage();','final FlutterSecureStorage _secureStorage = const FlutterSecureStorage();')
          c.write_text(s)
          m=Path('lib/main.dart')
          s=m.read_text().replace("import 'package:cryptography_flutter/cryptography_flutter.dart';\n",'').replace('  FlutterCryptography.enable();\n','').replace('FlutterCryptography.enable();\n','')
          m.write_text(s)
          p=Path('pubspec.yaml')
          p.write_text('\n'.join(x for x in p.read_text().splitlines() if not x.strip().startswith('cryptography_flutter:'))+'\n')
          PY
          dart format lib test
          flutter pub get

      - name: Reapply validated V1.9 gameplay audit
        shell: bash
        run: |
          set -euo pipefail
          cat neurocore/ci/v1_9_patch/part_*.patch > /tmp/v19.patch
          cd neurocore/ci/app
          set +e
          patch -p1 --batch --forward < /tmp/v19.patch
          STATUS=$?
          set -e
          REJECTS=$(find . -name '*.rej' -print)
          if [ -n "$REJECTS" ]; then
            BAD=$(echo "$REJECTS" | grep -v '^./lib/features/g06_social/g06_screen.dart.rej$' || true)
            test -z "$BAD"
          elif [ "$STATUS" -ne 0 ]; then
            exit 1
          fi
          cd ../../..
          cp -a neurocore/ci/v1_9_overlay/. neurocore/ci/app/
          cd neurocore/ci/app
          rm -f lib/features/g06_social/g06_screen.dart.rej
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pubspec.yaml'); p.write_text(p.read_text().replace('version: 1.7.0+17','version: 1.9.0+19').replace('NeuroCore V1.7 FINAL RC2','NeuroCore V1.9 AUDITED'))
          h=Path('lib/features/home/home_screen.dart'); h.write_text(h.read_text().replace('V1.7 FINAL RC2 • local • 6 jogos • acessível • privacidade • sessão selada • ML shadow/fail-closed','V1.9 AUDITED • 6 jogos • VÁ/PARE balanceado • sons/háptica • mais variedade visual • privacidade • ML shadow/fail-closed'))
          PY
          dart fix --apply
          dart format lib test
          flutter pub get

      - name: Verify and apply V2.1 product audit patch
        shell: bash
        run: |
          set -euo pipefail
          cat neurocore/ci/v2_1_patch/part_*.patch > /tmp/v21.patch
          echo "${V21_PATCH_SHA256}  /tmp/v21.patch" | sha256sum --check --strict
          cd neurocore/ci/app
          patch -p1 --batch --forward < /tmp/v21.patch
          test ! -e lib/features/g06_social/g06_screen.dart.orig

      - name: Generate local audio and branded Android icon
        working-directory: neurocore/ci/app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          python3 - <<'PY'
          import math, struct, wave, zlib, binascii
          from pathlib import Path
          audio=Path('assets/audio'); audio.mkdir(parents=True, exist_ok=True)
          rate=22050
          specs={
            'start.wav':([523.25,659.25],.18,.22),
            'correct.wav':([659.25,783.99,1046.50],.24,.24),
            'gentle_miss.wav':([440.,392.],.16,.18),
            'complete.wav':([523.25,659.25,783.99,1046.50],.32,.24),
          }
          for name,(freqs,duration,amp) in specs.items():
            frames=[]
            for i in range(int(rate*duration)):
              t=i/rate; pos=t/duration
              env=min(1.,pos/.08,(1-pos)/.18 if pos>.82 else 1.)
              tone=sum(math.sin(2*math.pi*f*t) for f in freqs)/len(freqs)
              frames.append(struct.pack('<h',int(32767*amp*max(0,env)*tone)))
            with wave.open(str(audio/name),'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate); w.writeframes(b''.join(frames))

          def png(path, size):
            bg=(83,101,210,255); white=(255,255,255,245); green=(39,133,110,255)
            rows=[]; cx=cy=(size-1)/2; r=size*.34
            for y in range(size):
              row=bytearray([0])
              for x in range(size):
                dx=x-cx; dy=y-cy; d=(dx*dx+dy*dy)**.5
                color=bg
                if d < r: color=white
                # central diamond/spark
                if abs(dx)+abs(dy) < size*.20: color=bg
                gx=size*.70; gy=size*.30
                if (x-gx)**2+(y-gy)**2 < (size*.055)**2: color=green
                row.extend(color)
              rows.append(bytes(row))
            raw=b''.join(rows)
            def chunk(kind,data):
              return struct.pack('>I',len(data))+kind+data+struct.pack('>I',binascii.crc32(kind+data)&0xffffffff)
            out=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',size,size,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
            Path(path).write_bytes(out)
          for folder,size in {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}.items():
            p=Path('android/app/src/main/res')/folder/'ic_launcher.png'; p.parent.mkdir(parents=True,exist_ok=True); png(p,size)
          PY
          for f in assets/audio/*.wav; do test -s "$f"; done
          grep -q 'android:label="NeuroCore"' android/app/src/main/AndroidManifest.xml

      - name: Normalize V2.1 and enforce product contracts
        working-directory: neurocore/ci/app
        shell: bash
        run: |
          set -euo pipefail
          dart fix --apply
          dart format lib test
          flutter pub get
          grep -q '^version: 2.1.0+21' pubspec.yaml
          grep -q 'audioplayers: 6.8.1' pubspec.yaml
          grep -q "recommendedAge = '6 a 11 anos'" lib/core/product/product_info.dart
          grep -q 'minimumSessionsPerDomain = 3' lib/core/profile/neuro_profile_aggregator.dart
          grep -q 'SocialChoice' lib/features/g06_social/social_scenario.dart
          grep -q 'guided_self_regulation_practice_non_diagnostic' lib/features/g05_regulation/g05_screen.dart
          grep -q 'Guia para responsáveis' lib/features/parent/parent_guide_screen.dart
          ! grep -R -qE 'V1\.7|V0\.6|FINAL RC2|preferredIndex|Indicador global de gameplay' lib test
          ! grep -E -q 'google_mobile_ads|firebase_analytics|facebook_app_events|amplitude_flutter|mixpanel_flutter|geolocator|app_tracking_transparency' pubspec.yaml
          ! flutter pub deps | grep -q 'cryptography_flutter'

      - name: Flutter analyze strict
        working-directory: neurocore/ci/app
        run: flutter analyze

      - name: Flutter tests complete
        working-directory: neurocore/ci/app
        run: flutter test --reporter expanded

      - name: Android APK
        working-directory: neurocore/ci/app
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug 2>&1 | tee /tmp/build.log
          ! grep -q 'plugins that apply Kotlin Gradle Plugin' /tmp/build.log
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Create V2.1 evidence
        working-directory: neurocore/ci/app
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          TEST_FILES=$(find test -maxdepth 1 -name '*_test.dart' | wc -l)
          tar -czf neurocore_v2_1_source.tar.gz pubspec.yaml pubspec.lock analysis_options.yaml lib test android assets
          SOURCE_SHA=$(sha256sum neurocore_v2_1_source.tar.gz | awk '{print $1}')
          python3 - "$APK_SHA" "$SOURCE_SHA" "$TEST_FILES" <<'PY'
          import json,sys
          data={
            'version':'2.1.0+21',
            'flutter_analyze_strict':'pass',
            'flutter_tests':'pass',
            'test_files':int(sys.argv[3]),
            'apk_build':'pass',
            'recommended_age':'6-11',
            'child_home_compact':'pass',
            'parent_guide_six_games':'pass',
            'parent_domain_min_sessions':3,
            'cross_game_global_score':'removed',
            'g01_dynamic_target':'pass',
            'g02_pare_guaranteed':'pass',
            'g02_max_consecutive_va':3,
            'g03_colored_memory_symbols':'pass',
            'g04_rule_change_cue':'pass',
            'g05_guided_practice':'pass',
            'g06_multiple_supportive_choices':'pass',
            'audio_assets':'4_local_wav',
            'android_branding':'NeuroCore_custom_icon',
            'clinical_positioning':'neuroeducational_non_diagnostic_non_treatment',
            'third_party_ads_analytics':'absent',
            'internationalization':'planned_not_yet_localized',
            'apk_sha256':sys.argv[1],
            'source_sha256':sys.argv[2],
          }
          open('neurocore_v2_1_evidence.json','w').write(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          cat neurocore_v2_1_evidence.json
          sha256sum "$APK" neurocore_v2_1_source.tar.gz assets/audio/*.wav android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Upload V2.1 audited APK
        uses: actions/upload-artifact@v4
        with:
          name: neurocore-v2.1-product-aligned-android
          path: |
            neurocore/ci/app/build/app/outputs/flutter-apk/app-debug.apk
            neurocore/ci/app/neurocore_v2_1_evidence.json
            neurocore/ci/app/neurocore_v2_1_source.tar.gz
            neurocore/ci/app/pubspec.lock
          if-no-files-found: error
          retention-days: 14
