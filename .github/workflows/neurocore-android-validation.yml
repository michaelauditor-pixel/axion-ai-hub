name: NeuroCore Android Validation

on:
  push:
    branches:
      - neurocore-local-v1-7-validation
    paths:
      - 'neurocore/**'
      - '.github/workflows/neurocore-android-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'neurocore/**'
      - '.github/workflows/neurocore-android-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'
  SOURCE_SHA256: '0aa63928c44bbacc142db6449abb51abfb91de3bb00d92e07211a465ea39aaf2'
  SECURE_STORAGE_VERSION: '10.3.1'

jobs:
  validate-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4

      - name: Reconstruct NeuroCore SSOT archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            neurocore/ci/source_chunks/chunk_00.b64 \
            neurocore/ci/source_chunks/chunk_01.b64 \
            neurocore/ci/source_chunks/chunk_02.b64 \
            neurocore/ci/source_chunks/chunk_03.b64 \
            neurocore/ci/source_chunks/chunk_04.b64 \
            neurocore/ci/source_chunks/chunk_05_00.b64 \
            neurocore/ci/source_chunks/chunk_05_01.b64 \
            neurocore/ci/source_chunks/chunk_05_02.b64 \
            neurocore/ci/source_chunks/chunk_05_03.b64 \
            neurocore/ci/source_chunks/chunk_06_00.b64 \
            neurocore/ci/source_chunks/chunk_06_01.b64 \
            neurocore/ci/source_chunks/chunk_06_02.b64 \
            neurocore/ci/source_chunks/chunk_06_03.b64 \
            neurocore/ci/source_chunks/chunk_07.b64 \
            > neurocore/ci/neurocore_source.b64
          base64 --decode neurocore/ci/neurocore_source.b64 > neurocore/ci/neurocore_source.tar.gz
          echo "${SOURCE_SHA256}  neurocore/ci/neurocore_source.tar.gz" | sha256sum --check --strict
          mkdir -p neurocore/ci/app
          tar -xzf neurocore/ci/neurocore_source.tar.gz -C neurocore/ci/app
          test -f neurocore/ci/app/pubspec.yaml
          test -f neurocore/ci/app/lib/main.dart
          test -d neurocore/ci/app/test

      - name: Apply dependency compatibility baseline
        working-directory: neurocore/ci/app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text()
          s = s.replace('flutter_secure_storage: ^11.0.0', 'flutter_secure_storage: 10.3.1')
          s = s.replace('  cryptography_flutter: ^2.3.4\n', '')
          if 'flutter_secure_storage: 10.3.1' not in s:
              raise SystemExit('secure storage pin not applied')
          if 'cryptography_flutter:' in s:
              raise SystemExit('legacy cryptography_flutter plugin remains')
          p.write_text(s)
          PY

      - name: Setup Flutter pinned stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Record toolchain
        working-directory: neurocore/ci/app
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version

      - name: Generate Android wrapper without replacing NeuroCore source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/neurocore_scaffold
          flutter create --org br.com.neurocore --project-name neurocore_app --platforms=android /tmp/neurocore_scaffold
          cp -a /tmp/neurocore_scaffold/android neurocore/ci/app/android
          python3 - <<'PY'
          from pathlib import Path
          root = Path('neurocore/ci/app')
          kts = root/'android/app/build.gradle.kts'
          groovy = root/'android/app/build.gradle'
          if kts.exists():
              s = kts.read_text()
              s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              s = s.replace('minSdk = 23', 'minSdk = 24')
              kts.write_text(s)
          elif groovy.exists():
              s = groovy.read_text()
              s = s.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
              s = s.replace('minSdkVersion 23', 'minSdkVersion 24')
              groovy.write_text(s)
          manifest = root/'android/app/src/main/AndroidManifest.xml'
          s = manifest.read_text()
          if 'android:allowBackup=' not in s:
              s = s.replace('<application', '<application android:allowBackup="false"', 1)
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="false"', 1)
          manifest.write_text(s)
          PY

      - name: Flutter pub get baseline
        working-directory: neurocore/ci/app
        run: flutter pub get

      - name: Normalize V1.8 baseline before audit patch
        working-directory: neurocore/ci/app
        shell: bash
        run: |
          set -euo pipefail
          dart fix --apply
          python3 - <<'PY'
          from pathlib import Path
          crypto = Path('lib/core/security/crypto_box.dart')
          s = crypto.read_text()
          s = s.replace('const FlutterSecureStorage _secureStorage = FlutterSecureStorage();','final FlutterSecureStorage _secureStorage = const FlutterSecureStorage();')
          s = s.replace('const FlutterSecureStorage _secureStorage = const FlutterSecureStorage();','final FlutterSecureStorage _secureStorage = const FlutterSecureStorage();')
          crypto.write_text(s)
          main = Path('lib/main.dart')
          s = main.read_text()
          s = s.replace("import 'package:cryptography_flutter/cryptography_flutter.dart';\n", '')
          s = s.replace('  FlutterCryptography.enable();\n', '')
          s = s.replace('FlutterCryptography.enable();\n', '')
          main.write_text(s)
          pub = Path('pubspec.yaml')
          s = pub.read_text()
          lines = [line for line in s.splitlines() if not line.strip().startswith('cryptography_flutter:')]
          pub.write_text('\n'.join(lines) + '\n')
          PY
          dart format lib test
          flutter pub get

      - name: Apply NeuroCore V1.9 full gameplay audit patch
        shell: bash
        run: |
          set -euo pipefail
          cat neurocore/ci/v1_9_patch/part_*.patch > /tmp/neurocore-v1.9.patch
          cd neurocore/ci/app
          patch -p1 --batch --forward < /tmp/neurocore-v1.9.patch
          dart format lib test
          flutter pub get
          grep -q 'generateBlock' lib/features/g02_inhibition/inhibition_trial.dart
          grep -q 'max_consecutive_go' lib/features/g02_inhibition/g02_screen.dart
          grep -q 'responseWindowMs' lib/features/g05_regulation/regulation_difficulty_config.dart
          grep -q 'PresentedSocialScenario' lib/features/g06_social/social_scenario.dart
          test -f lib/widgets/game_visual_strip.dart
          test -f lib/core/feedback/game_feedback_service.dart

      - name: CI source contract smoke-check
        working-directory: neurocore/ci/app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          required = [
              'pubspec.yaml', 'lib/main.dart', 'lib/app.dart',
              'lib/core/data/local_database.dart',
              'lib/core/security/parent_gate_service.dart',
              'lib/core/telemetry/telemetry_service.dart',
              'lib/core/profile/neuro_profile_service.dart',
              'lib/core/feedback/game_feedback_service.dart',
              'lib/widgets/game_visual_strip.dart',
              'lib/features/g01_focus/g01_screen.dart',
              'lib/features/g02_inhibition/g02_screen.dart',
              'lib/features/g03_memory/g03_screen.dart',
              'lib/features/g04_flexibility/g04_screen.dart',
              'lib/features/g05_regulation/g05_screen.dart',
              'lib/features/g06_social/g06_screen.dart',
          ]
          missing = [p for p in required if not (root/p).exists()]
          if missing:
              raise SystemExit('Missing V1.9 files: ' + ', '.join(missing))
          pubspec = (root/'pubspec.yaml').read_text()
          forbidden = ['google_mobile_ads','firebase_analytics','facebook_app_events','amplitude_flutter','mixpanel_flutter','geolocator','app_tracking_transparency']
          bad = [x for x in forbidden if x in pubspec]
          if bad:
              raise SystemExit('Forbidden child-directed dependency: ' + ', '.join(bad))
          tests = list((root/'test').glob('*_test.dart'))
          print(f'CI_SOURCE_CONTRACT_PASS tests={len(tests)}')
          PY

      - name: Flutter analyze strict
        working-directory: neurocore/ci/app
        run: flutter analyze

      - name: Flutter tests
        working-directory: neurocore/ci/app
        run: flutter test --reporter expanded

      - name: Android debug APK
        working-directory: neurocore/ci/app
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug 2>&1 | tee /tmp/neurocore-build.log
          if grep -q 'plugins that apply Kotlin Gradle Plugin' /tmp/neurocore-build.log; then
            echo 'Legacy KGP plugin warning remains' >&2
            exit 1
          fi

      - name: Package V1.9 source and validation evidence
        working-directory: neurocore/ci/app
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          export APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          export FLUTTER_VER=$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])')
          export DART_VER=$(dart --version 2>&1 | sed 's/^Dart SDK version: //')
          export LOCK_SHA=$(sha256sum pubspec.lock | awk '{print $1}')
          export TEST_COUNT=$(find test -maxdepth 1 -name '*_test.dart' | wc -l | tr -d ' ')
          tar -czf neurocore_v1_9_source.tar.gz pubspec.yaml pubspec.lock analysis_options.yaml lib test android
          export SOURCE_FIXED_SHA=$(sha256sum neurocore_v1_9_source.tar.gz | awk '{print $1}')
          python3 - <<'PY'
          import json, os
          evidence = {
              'version': '1.9.0-audited',
              'original_source_sha256': os.environ['SOURCE_SHA256'],
              'audited_source_sha256': os.environ['SOURCE_FIXED_SHA'],
              'flutter_version': os.environ['FLUTTER_VER'],
              'dart_version': os.environ['DART_VER'],
              'flutter_secure_storage': os.environ['SECURE_STORAGE_VERSION'],
              'flutter_analyze_strict': 'pass',
              'flutter_test_files': int(os.environ['TEST_COUNT']),
              'flutter_test': 'pass',
              'apk_build': 'pass',
              'g02_balanced_no_go': 'enforced',
              'g05_omission_timeout': 'enforced',
              'g06_choice_position_bias': 'corrected',
              'g06_story_variety': 'expanded',
              'sound_feedback': 'enabled_when_preference_allows',
              'visual_variety': 'expanded_vector_visuals',
              'apk_sha256': os.environ['APK_SHA'],
              'branch': os.environ.get('GITHUB_HEAD_REF') or os.environ.get('GITHUB_REF_NAME'),
              'commit': os.environ['GITHUB_SHA'],
          }
          with open('neurocore_v1_9_evidence.json','w',encoding='utf-8') as f:
              json.dump(evidence,f,indent=2,ensure_ascii=False)
              f.write('\n')
          PY
          python3 -m json.tool neurocore_v1_9_evidence.json >/dev/null
          cat neurocore_v1_9_evidence.json
          sha256sum "$APK" neurocore_v1_9_source.tar.gz pubspec.lock

      - name: Upload V1.9 APK, audited source and evidence
        uses: actions/upload-artifact@v4
        with:
          name: neurocore-v1.9-audited-android
          path: |
            neurocore/ci/app/build/app/outputs/flutter-apk/app-debug.apk
            neurocore/ci/app/neurocore_v1_9_evidence.json
            neurocore/ci/app/neurocore_v1_9_source.tar.gz
            neurocore/ci/app/pubspec.lock
          if-no-files-found: error
          retention-days: 14
