name: NeuroCore Android Validation
on:
  push:
    branches: [neurocore-local-v1-7-validation]
    paths: ['neurocore/**','.github/workflows/neurocore-android-validation.yml']
  pull_request:
    branches: [main]
    paths: ['neurocore/**','.github/workflows/neurocore-android-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  FLUTTER_VERSION: '3.47.0'
  SOURCE_SHA256: '0aa63928c44bbacc142db6449abb51abfb91de3bb00d92e07211a465ea39aaf2'
  SECURE_STORAGE_VERSION: '10.3.1'
jobs:
  validate-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct V1.8 validated baseline
        shell: bash
        run: |
          set -euo pipefail
          cat neurocore/ci/source_chunks/chunk_00.b64 neurocore/ci/source_chunks/chunk_01.b64 neurocore/ci/source_chunks/chunk_02.b64 neurocore/ci/source_chunks/chunk_03.b64 neurocore/ci/source_chunks/chunk_04.b64 neurocore/ci/source_chunks/chunk_05_00.b64 neurocore/ci/source_chunks/chunk_05_01.b64 neurocore/ci/source_chunks/chunk_05_02.b64 neurocore/ci/source_chunks/chunk_05_03.b64 neurocore/ci/source_chunks/chunk_06_00.b64 neurocore/ci/source_chunks/chunk_06_01.b64 neurocore/ci/source_chunks/chunk_06_02.b64 neurocore/ci/source_chunks/chunk_06_03.b64 neurocore/ci/source_chunks/chunk_07.b64 > neurocore/ci/source.b64
          base64 --decode neurocore/ci/source.b64 > neurocore/ci/source.tar.gz
          echo "${SOURCE_SHA256}  neurocore/ci/source.tar.gz" | sha256sum --check --strict
          mkdir -p neurocore/ci/app
          tar -xzf neurocore/ci/source.tar.gz -C neurocore/ci/app
      - name: Compatibility baseline
        working-directory: neurocore/ci/app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pubspec.yaml'); s=p.read_text().replace('flutter_secure_storage: ^11.0.0','flutter_secure_storage: 10.3.1')
          s='\n'.join(x for x in s.splitlines() if not x.strip().startswith('cryptography_flutter:'))+'\n'; p.write_text(s)
          m=Path('lib/main.dart'); s=m.read_text().replace("import 'package:cryptography_flutter/cryptography_flutter.dart';\n",'').replace('  FlutterCryptography.enable();\n','').replace('FlutterCryptography.enable();\n',''); m.write_text(s)
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Generate Android wrapper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nc
          flutter create --org br.com.neurocore --project-name neurocore_app --platforms=android /tmp/nc
          cp -a /tmp/nc/android neurocore/ci/app/android
          python3 - <<'PY'
          from pathlib import Path
          root=Path('neurocore/ci/app'); k=root/'android/app/build.gradle.kts'; s=k.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 24').replace('minSdk = 23','minSdk = 24'); k.write_text(s)
          m=root/'android/app/src/main/AndroidManifest.xml'; s=m.read_text(); s=s.replace('<application','<application android:allowBackup="false" android:usesCleartextTraffic="false"',1); m.write_text(s)
          PY
      - name: Normalize baseline
        working-directory: neurocore/ci/app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart fix --apply
          python3 - <<'PY'
          from pathlib import Path
          c=Path('lib/core/security/crypto_box.dart'); s=c.read_text().replace('const FlutterSecureStorage _secureStorage = FlutterSecureStorage();','final FlutterSecureStorage _secureStorage = const FlutterSecureStorage();').replace('const FlutterSecureStorage _secureStorage = const FlutterSecureStorage();','final FlutterSecureStorage _secureStorage = const FlutterSecureStorage();'); c.write_text(s)
          m=Path('lib/main.dart'); s=m.read_text().replace("import 'package:cryptography_flutter/cryptography_flutter.dart';\n",'').replace('  FlutterCryptography.enable();\n','').replace('FlutterCryptography.enable();\n',''); m.write_text(s)
          p=Path('pubspec.yaml'); s='\n'.join(x for x in p.read_text().splitlines() if not x.strip().startswith('cryptography_flutter:'))+'\n'; p.write_text(s)
          PY
          dart format lib test
          flutter pub get
      - name: Apply V1.9 audited gameplay changes
        shell: bash
        run: |
          set -euo pipefail
          cat neurocore/ci/v1_9_patch/part_*.patch > /tmp/v19.patch
          cd neurocore/ci/app
          set +e
          patch -p1 --batch --forward < /tmp/v19.patch
          PATCH_STATUS=$?
          set -e
          REJECTS=$(find . -name '*.rej' -print)
          if [ -n "$REJECTS" ]; then
            echo "$REJECTS"
            BAD=$(echo "$REJECTS" | grep -v '^./lib/features/g06_social/g06_screen.dart.rej$' || true)
            if [ -n "$BAD" ]; then echo "Unexpected patch reject" >&2; exit 1; fi
          elif [ "$PATCH_STATUS" -ne 0 ]; then
            echo "Patch failed without expected G06 reject" >&2; exit 1
          fi
          cd ../../..
          cp -a neurocore/ci/v1_9_overlay/. neurocore/ci/app/
          cd neurocore/ci/app
          rm -f lib/features/g06_social/g06_screen.dart.rej
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pubspec.yaml'); s=p.read_text().replace('version: 1.7.0+17','version: 1.9.0+19').replace('NeuroCore V1.7 FINAL RC2','NeuroCore V1.9 AUDITED'); p.write_text(s)
          h=Path('lib/features/home/home_screen.dart'); s=h.read_text().replace('V1.7 FINAL RC2 • local • 6 jogos • acessível • privacidade • sessão selada • ML shadow/fail-closed','V1.9 AUDITED • 6 jogos • VÁ/PARE balanceado • sons/háptica • mais variedade visual • privacidade • ML shadow/fail-closed'); h.write_text(s)
          PY
          dart format lib test
          flutter pub get
          grep -q 'generateBlock' lib/features/g02_inhibition/inhibition_trial.dart
          grep -q 'max_consecutive_go' lib/features/g02_inhibition/g02_screen.dart
          grep -q 'responseWindowMs' lib/features/g05_regulation/regulation_difficulty_config.dart
          grep -q 'PresentedSocialScenario' lib/features/g06_social/social_scenario.dart
          test -f lib/widgets/game_visual_strip.dart
          test -f lib/core/feedback/game_feedback_service.dart
          test -f test/v19_audit_regression_test.dart
      - name: Flutter analyze strict
        working-directory: neurocore/ci/app
        run: flutter analyze
      - name: Flutter tests complete
        working-directory: neurocore/ci/app
        run: flutter test --reporter expanded
      - name: Android APK
        working-directory: neurocore/ci/app
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug 2>&1 | tee /tmp/build.log
          ! grep -q 'plugins that apply Kotlin Gradle Plugin' /tmp/build.log
      - name: Create V1.9 evidence
        working-directory: neurocore/ci/app
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          TEST_FILES=$(find test -maxdepth 1 -name '*_test.dart' | wc -l)
          tar -czf neurocore_v1_9_source.tar.gz pubspec.yaml pubspec.lock analysis_options.yaml lib test android
          SOURCE_SHA=$(sha256sum neurocore_v1_9_source.tar.gz | awk '{print $1}')
          python3 - "$APK_SHA" "$SOURCE_SHA" "$TEST_FILES" <<'PY'
          import json,sys
          data={'version':'1.9.0+19','flutter_analyze_strict':'pass','flutter_tests':'pass','test_files':int(sys.argv[3]),'apk_build':'pass','g02_pare_guaranteed':'pass','g02_max_consecutive_va':3,'g05_omission_timeout':'pass','g06_position_bias':'corrected','g06_unique_story_pool':8,'sound_feedback':'local_system_sound_and_haptics','visual_variety':'expanded_vector_visuals','apk_sha256':sys.argv[1],'source_sha256':sys.argv[2]}
          open('neurocore_v1_9_evidence.json','w').write(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          cat neurocore_v1_9_evidence.json
      - name: Upload V1.9 audited APK
        uses: actions/upload-artifact@v4
        with:
          name: neurocore-v1.9-audited-android
          path: |
            neurocore/ci/app/build/app/outputs/flutter-apk/app-debug.apk
            neurocore/ci/app/neurocore_v1_9_evidence.json
            neurocore/ci/app/neurocore_v1_9_source.tar.gz
            neurocore/ci/app/pubspec.lock
          if-no-files-found: error
          retention-days: 14
